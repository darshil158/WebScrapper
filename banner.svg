<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="WebNovel Scraper and EPUB Creator banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b1e"/>
      <stop offset="55%" stop-color="#161238"/>
      <stop offset="100%" stop-color="#0a2a33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c6cf0"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c6cf0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>

  <!-- drifting glow orbs -->
  <circle cx="180" cy="90" r="190" fill="url(#glowA)">
    <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;150;90" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="300" r="210" fill="url(#glowB)">
    <animate attributeName="cx" values="1030;940;1030" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;230;300" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 95H1200M0 190H1200M0 285H1200"/>
    <path d="M240 0V380M480 0V380M720 0V380M960 0V380"/>
  </g>

  <!-- floating page glyphs -->
  <g fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.6">
    <g>
      <rect x="90" y="250" width="34" height="44" rx="4"/>
      <path d="M98 262h18M98 270h18M98 278h11"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="1075" y="60" width="34" height="44" rx="4" stroke="#2dd4bf"/>
      <path d="M1083 72h18M1083 80h18M1083 88h11" stroke="#2dd4bf"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- book icon -->
  <g transform="translate(540 44)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" repeatCount="indefinite"/>
      <path d="M60 8C42 0 20 0 0 6v58c20-6 42-6 60 2 18-8 40-8 60-2V6C100 0 78 0 60 8Z" fill="#1b1750" stroke="url(#title)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M60 8v58" stroke="url(#title)" stroke-width="2.5"/>
      <g stroke="#a78bfa" stroke-opacity="0.75" stroke-width="2.4" stroke-linecap="round">
        <path d="M14 22c12-3 26-3 36 1M14 34c12-3 26-3 36 1M14 46c12-3 26-3 36 1"/>
      </g>
      <g stroke="#2dd4bf" stroke-opacity="0.85" stroke-width="2.4" stroke-linecap="round">
        <path d="M70 23c10-4 24-4 36-1M70 35c10-4 24-4 36-1M70 47c10-4 24-4 36-1"/>
      </g>
    </g>
  </g>

  <!-- title -->
  <text x="600" y="190" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.2" fill="url(#title)">WebNovel Scraper</text>
  <text x="600" y="232" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="500" fill="#c9c6ee" letter-spacing="6">
    &amp; EPUB CREATOR
  </text>

  <!-- pipeline strip -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="15" font-weight="600" text-anchor="middle">
    <g transform="translate(250 290)">
      <rect width="150" height="42" rx="21" fill="#7c6cf0" fill-opacity="0.18" stroke="#7c6cf0" stroke-opacity="0.7"/>
      <text x="75" y="27" fill="#d6d1ff">1 · DETECT</text>
    </g>
    <g transform="translate(430 290)">
      <rect width="150" height="42" rx="21" fill="#7c6cf0" fill-opacity="0.18" stroke="#7c6cf0" stroke-opacity="0.7"/>
      <text x="75" y="27" fill="#d6d1ff">2 · SCRAPE</text>
    </g>
    <g transform="translate(610 290)">
      <rect width="150" height="42" rx="21" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-opacity="0.7"/>
      <text x="75" y="27" fill="#b8f5ec">3 · CLEAN</text>
    </g>
    <g transform="translate(790 290)">
      <rect width="160" height="42" rx="21" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-opacity="0.7"/>
      <text x="80" y="27" fill="#b8f5ec">4 · EPUB 3</text>
    </g>

    <!-- connectors -->
    <g stroke="#8b83c9" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6">
      <path d="M400 311h30"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/></path>
      <path d="M580 311h30"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/></path>
      <path d="M760 311h30"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/></path>
    </g>

    <!-- travelling pulse along the pipeline -->
    <circle r="6" fill="#fff" filter="url(#soft)">
      <animate attributeName="cx" values="325;505;685;870;325" keyTimes="0;0.25;0.5;0.75;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="311;311;311;311;311" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;1;0" keyTimes="0;0.7;0.9;0.99;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
